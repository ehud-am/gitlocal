name: Deploy website

# Vendored copy of Vizoalica's reusable deployment workflow
# (ehud-am/vizoalica: .github/workflows/deploy-vizoalica-pages.yml, v0.7.4).
# It does not auto-update; re-sync by diffing against that file. Changes from
# the source: runs on push/manual dispatch instead of workflow_call, the site
# directory is fixed to docs, and every setting is read from a repository
# secret or, if no secret of that name exists, a repository variable.
#
# Required (secret or variable): VIZOALICA_INGEST_ENDPOINT,
# VIZOALICA_PUBLIC_SOURCE_KEY, VIZOALICA_PROJECT_ID, VIZOALICA_SOURCE_ID,
# VIZOALICA_SITE_ORIGINS, CF_ACCOUNT_ID, CF_PAGES_PROJECT. The first five may
# instead come from one VIZOALICA_SITE JSON value.
# Required secrets: CF_API_TOKEN (Cloudflare Pages: Edit scope only),
# VIZOALICA_TOKEN_SECRET (>= 32 random characters).
# Optional, with defaults: VIZOALICA_SDK_SRC (/vizoalica.js),
# VIZOALICA_TOKEN_URL (/vizoalica/ingest-token), VIZOALICA_CONSENT (unknown).

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/deploy-website.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Resolve and validate configuration
        env:
          SITE_BUNDLE: ${{ secrets.VIZOALICA_SITE || vars.VIZOALICA_SITE }}
          VIZOALICA_SDK_SRC: ${{ secrets.VIZOALICA_SDK_SRC || vars.VIZOALICA_SDK_SRC }}
          VIZOALICA_INGEST_ENDPOINT: ${{ secrets.VIZOALICA_INGEST_ENDPOINT || vars.VIZOALICA_INGEST_ENDPOINT }}
          VIZOALICA_PUBLIC_SOURCE_KEY: ${{ secrets.VIZOALICA_PUBLIC_SOURCE_KEY || vars.VIZOALICA_PUBLIC_SOURCE_KEY }}
          VIZOALICA_PROJECT_ID: ${{ secrets.VIZOALICA_PROJECT_ID || vars.VIZOALICA_PROJECT_ID }}
          VIZOALICA_TOKEN_URL: ${{ secrets.VIZOALICA_TOKEN_URL || vars.VIZOALICA_TOKEN_URL }}
          VIZOALICA_CONSENT: ${{ secrets.VIZOALICA_CONSENT || vars.VIZOALICA_CONSENT }}
          VIZOALICA_SOURCE_ID: ${{ secrets.VIZOALICA_SOURCE_ID || vars.VIZOALICA_SOURCE_ID }}
          VIZOALICA_SITE_ORIGINS: ${{ secrets.VIZOALICA_SITE_ORIGINS || vars.VIZOALICA_SITE_ORIGINS }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT || vars.CF_PAGES_PROJECT }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VIZOALICA_TOKEN_SECRET: ${{ secrets.VIZOALICA_TOKEN_SECRET }}
          # Inputs and variables reach the shell as environment variables, never as text pasted into
          # the script, so a crafted value cannot become a command.
          SITE_DIRECTORY: docs
        run: |
          set -euo pipefail
          # The bundled value fills in whatever was not set separately. jq reads it as data.
          if [ -n "${SITE_BUNDLE:-}" ]; then
            if ! echo "$SITE_BUNDLE" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "::error::VIZOALICA_SITE must be a JSON object"
              exit 1
            fi
            bundled() { echo "$SITE_BUNDLE" | jq -r "$1 // empty"; }
            : "${VIZOALICA_INGEST_ENDPOINT:=$(bundled .endpoint)}"
            : "${VIZOALICA_PUBLIC_SOURCE_KEY:=$(bundled .sourceKey)}"
            : "${VIZOALICA_PROJECT_ID:=$(bundled .projectId)}"
            : "${VIZOALICA_SOURCE_ID:=$(bundled .sourceId)}"
            : "${VIZOALICA_SITE_ORIGINS:=$(bundled '(.origins // []) | join(",")')}"
          fi
          # Settings that follow a convention need no variable.
          : "${VIZOALICA_SDK_SRC:=/vizoalica.js}"
          : "${VIZOALICA_TOKEN_URL:=/vizoalica/ingest-token}"
          : "${VIZOALICA_CONSENT:=unknown}"
          missing=()
          for name in VIZOALICA_SDK_SRC VIZOALICA_INGEST_ENDPOINT VIZOALICA_PUBLIC_SOURCE_KEY \
            VIZOALICA_PROJECT_ID VIZOALICA_TOKEN_URL VIZOALICA_CONSENT VIZOALICA_SOURCE_ID \
            VIZOALICA_SITE_ORIGINS CF_ACCOUNT_ID CF_PAGES_PROJECT CF_API_TOKEN \
            VIZOALICA_TOKEN_SECRET; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#VIZOALICA_TOKEN_SECRET}" -lt 32 ] 2>/dev/null; then
            echo "::error::VIZOALICA_TOKEN_SECRET must be at least 32 characters"
            exit 1
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repository variables/secrets: ${missing[*]}"
            echo "Set VIZOALICA_SITE (one value), CF_ACCOUNT_ID, CF_PAGES_PROJECT and the two secrets;" \
              "see the admin console's install page for the exact values."
            exit 1
          fi
          # The public values are written into a generated TOML file, so none may contain a character
          # that could end a value or start a new line, and none may carry a shell metacharacter.
          for name in VIZOALICA_SDK_SRC VIZOALICA_INGEST_ENDPOINT VIZOALICA_PUBLIC_SOURCE_KEY \
            VIZOALICA_PROJECT_ID VIZOALICA_TOKEN_URL VIZOALICA_CONSENT VIZOALICA_SOURCE_ID \
            VIZOALICA_SITE_ORIGINS CF_ACCOUNT_ID CF_PAGES_PROJECT; do
            value="${!name}"
            if [[ "$value" =~ [^[:graph:]] || "$value" == *\"* || "$value" == *\\* \
              || "$value" == *\$* || "$value" == *\`* ]]; then
              echo "::error::$name contains a space, control character, quote, backslash, dollar sign, or backtick"
              exit 1
            fi
          done
          # A relative path inside this repository ("." is the root): no leading slash or dash, no "..", no odd characters.
          if [ "$SITE_DIRECTORY" != "." ] && [[ ! "$SITE_DIRECTORY" =~ ^[A-Za-z0-9_][A-Za-z0-9._/-]*$ || "$SITE_DIRECTORY" == *..* ]]; then
            echo "::error::site-directory must be a relative path made of letters, digits, dots, dashes, underscores, and slashes"
            exit 1
          fi
          if [ ! -d "$SITE_DIRECTORY" ]; then
            echo "::error::site-directory '$SITE_DIRECTORY' does not exist in this repository"
            exit 1
          fi
          # Only values that passed the checks above (single line, no metacharacters) reach later
          # steps, so this file cannot be used to inject another variable.
          for name in VIZOALICA_SDK_SRC VIZOALICA_INGEST_ENDPOINT VIZOALICA_PUBLIC_SOURCE_KEY \
            VIZOALICA_PROJECT_ID VIZOALICA_TOKEN_URL VIZOALICA_CONSENT VIZOALICA_SOURCE_ID \
            VIZOALICA_SITE_ORIGINS; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      - name: Write vendored Vizoalica Pages Functions and loader
        # A reusable workflow's GITHUB_TOKEN never carries cross-repo access
        # to check out this (private) repository from the caller's job, even
        # with the reusable-workflow "access_level: user" permission granted
        # (that setting only controls which repos may resolve this
        # workflow_call, not what actions/checkout can read). So these three
        # small files are embedded here instead, kept in sync with their real
        # source under examples/cloudflare-pages/ by
        # `pnpm run generate:deploy-workflow` (enforced in CI).
        env:
          SITE_DIRECTORY: docs
          # BEGIN GENERATED: pnpm run generate:deploy-workflow
          CONFIG_JSON_TS_B64: 
          INGEST_TOKEN_TS_B64: 
          VIZOALICA_LOADER_JS_B64: 
          # END GENERATED
        run: |
          set -euo pipefail
          site="$SITE_DIRECTORY"
          mkdir -p "$site/functions/vizoalica"
          echo "$CONFIG_JSON_TS_B64" | base64 -d > "$site/functions/vizoalica/config.json.ts"
          echo "$INGEST_TOKEN_TS_B64" | base64 -d > "$site/functions/vizoalica/ingest-token.ts"
          echo "$VIZOALICA_LOADER_JS_B64" | base64 -d > "$site/vizoalica-loader.js"

      - name: Generate ephemeral Cloudflare Pages configuration
        # The VIZOALICA_* values were resolved and checked in the step above and arrive through the
        # job environment.
        env:
          CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT || vars.CF_PAGES_PROJECT }}
          SITE_DIRECTORY: docs
        run: |
          set -euo pipefail
          # This file exists only in the ephemeral CI workspace for this run.
          # It is never committed to the caller's repository.
          cat > "$SITE_DIRECTORY/wrangler.toml" <<TOML
          name = "$CF_PAGES_PROJECT"
          pages_build_output_dir = "."
          compatibility_date = "2026-09-09"

          [vars]
          VIZOALICA_SDK_SRC = "$VIZOALICA_SDK_SRC"
          VIZOALICA_INGEST_ENDPOINT = "$VIZOALICA_INGEST_ENDPOINT"
          VIZOALICA_PUBLIC_SOURCE_KEY = "$VIZOALICA_PUBLIC_SOURCE_KEY"
          VIZOALICA_PROJECT_ID = "$VIZOALICA_PROJECT_ID"
          VIZOALICA_TOKEN_URL = "$VIZOALICA_TOKEN_URL"
          VIZOALICA_CONSENT = "$VIZOALICA_CONSENT"
          VIZOALICA_SOURCE_ID = "$VIZOALICA_SOURCE_ID"
          VIZOALICA_SITE_ORIGINS = "$VIZOALICA_SITE_ORIGINS"
          TOML

      - name: Set the ingest token signing secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          VIZOALICA_TOKEN_SECRET: ${{ secrets.VIZOALICA_TOKEN_SECRET }}
          CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT || vars.CF_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          # An exact Wrangler version: this step runs with your Cloudflare token, so it must not
          # fetch whatever "latest 4.x" is on the day. Update it deliberately (see releases guide).
          printf '%s' "$VIZOALICA_TOKEN_SECRET" | npx --yes wrangler@4.127.1 pages secret put \
            VIZOALICA_TOKEN_SECRET --project-name "$CF_PAGES_PROJECT"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT || vars.CF_PAGES_PROJECT }}
          SITE_DIRECTORY: docs
          # A branch name is chosen by whoever pushes it, so it too goes through the environment.
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 pages deploy \
            --project-name "$CF_PAGES_PROJECT" \
            --branch "$DEPLOY_BRANCH" \
            --cwd "$SITE_DIRECTORY" \
            .
