name: Deploy website

# Vendored copy of vizoalica's reusable deployment workflow
# (ehud-am/vizoalica: .github/workflows/deploy-vizoalica-pages.yml).
#
# Inlined here, rather than called via a workflow_call "uses:" reference,
# because GitHub does not allow a public repository (this one) to call a
# reusable workflow that lives in a private repository (vizoalica),
# regardless of that repository's reusable-workflow access settings.
# This copy will not auto-update when vizoalica's workflow changes --
# re-sync manually by diffing against the source file above.
#
# Required repository variables: VIZOALICA_SDK_SRC,
# VIZOALICA_INGEST_ENDPOINT, VIZOALICA_PUBLIC_SOURCE_KEY,
# VIZOALICA_PROJECT_ID, VIZOALICA_TOKEN_URL, VIZOALICA_CONSENT,
# VIZOALICA_SOURCE_ID, VIZOALICA_SITE_ORIGINS, CF_ACCOUNT_ID,
# CF_PAGES_PROJECT.
# Required repository secrets: CF_API_TOKEN (Cloudflare Pages: Edit
# scope only), VIZOALICA_TOKEN_SECRET (>= 32 random characters).

on:
  push:
    branches: [main]
    paths: ["docs/**"]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out website repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate required configuration
        env:
          VIZOALICA_SDK_SRC: ${{ vars.VIZOALICA_SDK_SRC }}
          VIZOALICA_INGEST_ENDPOINT: ${{ vars.VIZOALICA_INGEST_ENDPOINT }}
          VIZOALICA_PUBLIC_SOURCE_KEY: ${{ vars.VIZOALICA_PUBLIC_SOURCE_KEY }}
          VIZOALICA_PROJECT_ID: ${{ vars.VIZOALICA_PROJECT_ID }}
          VIZOALICA_TOKEN_URL: ${{ vars.VIZOALICA_TOKEN_URL }}
          VIZOALICA_CONSENT: ${{ vars.VIZOALICA_CONSENT }}
          VIZOALICA_SOURCE_ID: ${{ vars.VIZOALICA_SOURCE_ID }}
          VIZOALICA_SITE_ORIGINS: ${{ vars.VIZOALICA_SITE_ORIGINS }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          VIZOALICA_TOKEN_SECRET: ${{ secrets.VIZOALICA_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          for name in VIZOALICA_SDK_SRC VIZOALICA_INGEST_ENDPOINT VIZOALICA_PUBLIC_SOURCE_KEY \
            VIZOALICA_PROJECT_ID VIZOALICA_TOKEN_URL VIZOALICA_CONSENT VIZOALICA_SOURCE_ID \
            VIZOALICA_SITE_ORIGINS CF_ACCOUNT_ID CF_PAGES_PROJECT CF_API_TOKEN \
            VIZOALICA_TOKEN_SECRET; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#VIZOALICA_TOKEN_SECRET}" -lt 32 ] 2>/dev/null; then
            echo "::error::VIZOALICA_TOKEN_SECRET must be at least 32 characters"
            exit 1
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required repository variables/secrets: ${missing[*]}"
            exit 1
          fi
          if [ ! -d "docs" ]; then
            echo "::error::site directory 'docs' does not exist in this repository"
            exit 1
          fi

      - name: Write vendored Vizoalica Pages Functions and loader
        env:
          CONFIG_JSON_TS_B64: 
          INGEST_TOKEN_TS_B64: 
          VIZOALICA_LOADER_JS_B64: 
        run: |
          set -euo pipefail
          mkdir -p docs/functions/vizoalica
          echo "$CONFIG_JSON_TS_B64" | base64 -d > docs/functions/vizoalica/config.json.ts
          echo "$INGEST_TOKEN_TS_B64" | base64 -d > docs/functions/vizoalica/ingest-token.ts
          echo "$VIZOALICA_LOADER_JS_B64" | base64 -d > docs/vizoalica-loader.js

      - name: Generate ephemeral Cloudflare Pages configuration
        env:
          VIZOALICA_SDK_SRC: ${{ vars.VIZOALICA_SDK_SRC }}
          VIZOALICA_INGEST_ENDPOINT: ${{ vars.VIZOALICA_INGEST_ENDPOINT }}
          VIZOALICA_PUBLIC_SOURCE_KEY: ${{ vars.VIZOALICA_PUBLIC_SOURCE_KEY }}
          VIZOALICA_PROJECT_ID: ${{ vars.VIZOALICA_PROJECT_ID }}
          VIZOALICA_TOKEN_URL: ${{ vars.VIZOALICA_TOKEN_URL }}
          VIZOALICA_CONSENT: ${{ vars.VIZOALICA_CONSENT }}
          VIZOALICA_SOURCE_ID: ${{ vars.VIZOALICA_SOURCE_ID }}
          VIZOALICA_SITE_ORIGINS: ${{ vars.VIZOALICA_SITE_ORIGINS }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          # This file exists only in the ephemeral CI workspace for this run.
          # It is never committed to this repository.
          cat > docs/wrangler.toml <<TOML
          name = "$CF_PAGES_PROJECT"
          pages_build_output_dir = "."
          compatibility_date = "2026-09-09"

          [vars]
          VIZOALICA_SDK_SRC = "$VIZOALICA_SDK_SRC"
          VIZOALICA_INGEST_ENDPOINT = "$VIZOALICA_INGEST_ENDPOINT"
          VIZOALICA_PUBLIC_SOURCE_KEY = "$VIZOALICA_PUBLIC_SOURCE_KEY"
          VIZOALICA_PROJECT_ID = "$VIZOALICA_PROJECT_ID"
          VIZOALICA_TOKEN_URL = "$VIZOALICA_TOKEN_URL"
          VIZOALICA_CONSENT = "$VIZOALICA_CONSENT"
          VIZOALICA_SOURCE_ID = "$VIZOALICA_SOURCE_ID"
          VIZOALICA_SITE_ORIGINS = "$VIZOALICA_SITE_ORIGINS"
          TOML

      - name: Set the ingest token signing secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          VIZOALICA_TOKEN_SECRET: ${{ secrets.VIZOALICA_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$VIZOALICA_TOKEN_SECRET" | npx --yes wrangler@4 pages secret put \
            VIZOALICA_TOKEN_SECRET --project-name "${{ vars.CF_PAGES_PROJECT }}"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy \
            --project-name "${{ vars.CF_PAGES_PROJECT }}" \
            --branch "${{ github.ref_name }}" \
            --cwd docs \
            .
